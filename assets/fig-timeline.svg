<svg viewBox="0 0 1000 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="연표: 2021 GitHub 시작, 2026 Showmoa, test moa, Pawmento, 지금 신입 백엔드 구직 중">
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", "D2Coding", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", monospace; }
    .ink { fill: #1F2328; } .muted { fill: #59636E; } .accent { fill: #1D4ED8; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .grow { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleY(1); } }
    .a1 { animation-delay: .1s } .a2 { animation-delay: .35s } .a3 { animation-delay: .6s } .a4 { animation-delay: .85s } .a5 { animation-delay: 1.1s }
    @media (prefers-reduced-motion: reduce) { .draw, .rise, .grow { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; } }
  </style>

  <text class="muted rise a1" x="0" y="20" font-size="14" letter-spacing="0">그림 03</text>
  <line class="draw a1" x1="20" y1="110" x2="980" y2="110" stroke="#D0D7DE"/>
  <g class="rise a2">
    <line x1="128" y1="100" x2="120" y2="120" stroke="#59636E"/>
    <line x1="138" y1="100" x2="130" y2="120" stroke="#59636E"/>
  </g>
  <g class="rise a1">
    <circle cx="20" cy="110" r="6" fill="#1F2328"/>
    <text class="muted" x="18" y="84" font-size="14" letter-spacing="0" text-anchor="start">2021.03</text>
    <text class="ink" x="18" y="150" font-size="17" text-anchor="start">GitHub 시작</text>
    <text class="muted" x="18" y="174" font-size="14" text-anchor="start">첫 저장소</text>
  </g>
  <g class="rise a2">
    <circle cx="230" cy="110" r="6" fill="#1F2328"/>
    <text class="muted" x="228" y="84" font-size="14" letter-spacing="0" text-anchor="start">2026.08</text>
    <text class="ink" x="228" y="150" font-size="17" text-anchor="start">Showmoa</text>
    <text class="muted" x="228" y="174" font-size="14" text-anchor="start">CTO · 데이터 동기화</text>
  </g>
  <g class="rise a3">
    <circle cx="420" cy="110" r="6" fill="#1F2328"/>
    <text class="muted" x="418" y="84" font-size="14" letter-spacing="0" text-anchor="start">2026.10</text>
    <text class="ink" x="418" y="150" font-size="17" text-anchor="start">test moa</text>
    <text class="muted" x="418" y="174" font-size="14" text-anchor="start">실시간 채팅</text>
  </g>
  <g class="rise a4">
    <circle cx="610" cy="110" r="6" fill="#1F2328"/>
    <text class="muted" x="608" y="84" font-size="14" letter-spacing="0" text-anchor="start">2026.11</text>
    <text class="ink" x="608" y="150" font-size="17" text-anchor="start">Pawmento</text>
    <text class="muted" x="608" y="174" font-size="14" text-anchor="start">인프라 · CI</text>
  </g>
  <g class="rise a5">
    <circle cx="980" cy="110" r="9" fill="#1D4ED8"/>
    <text class="accent" x="980" y="84" font-size="14" letter-spacing="0" text-anchor="end">지금</text>
    <text class="accent" x="980" y="150" font-size="17" text-anchor="end">구직 중</text>
    <text class="muted" x="980" y="174" font-size="14" text-anchor="end">신입 백엔드</text>
  </g>
</svg>
