<svg viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="활동 지표: 최근 12개월 커밋, PR, 리뷰, 이슈 수와 월별 기여">
  <style>
    @font-face { font-family: "ProfileMono"; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "ProfileKR"; src: url(data:font/woff2;base64,) format("woff2"); }
    text { font-family: "ProfileMono", "ProfileKR", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", "D2Coding", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", monospace; }
    .ink { fill: #1F2328; } .muted { fill: #59636E; } .accent { fill: #1D4ED8; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .grow { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleY(1); } }
    .a1 { animation-delay: .1s } .a2 { animation-delay: .35s } .a3 { animation-delay: .6s } .a4 { animation-delay: .85s } .a5 { animation-delay: 1.1s }
    @media (prefers-reduced-motion: reduce) { .draw, .rise, .grow { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; } }
  </style>

  <text class="muted rise a1" x="0" y="20" font-size="14" letter-spacing="2">FIG. 01</text>
  <text class="muted rise a1" x="1000" y="20" font-size="14" letter-spacing="2" text-anchor="end">UPDATED 2026.11.18</text>
  <g class="rise a1">
    <text class="ink" x="0" y="96" font-size="52" letter-spacing="-1">764</text>
    <text class="muted" x="0" y="124" font-size="14" letter-spacing="2">COMMITS</text>
  </g>
  <g class="rise a2">
    <text class="ink" x="190" y="96" font-size="52" letter-spacing="-1">144</text>
    <text class="muted" x="190" y="124" font-size="14" letter-spacing="2">PULL REQUESTS</text>
  </g>
  <g class="rise a3">
    <text class="ink" x="0" y="206" font-size="52" letter-spacing="-1">71</text>
    <text class="muted" x="0" y="234" font-size="14" letter-spacing="2">REVIEWS</text>
  </g>
  <g class="rise a4">
    <text class="ink" x="190" y="206" font-size="52" letter-spacing="-1">93</text>
    <text class="muted" x="190" y="234" font-size="14" letter-spacing="2">ISSUES</text>
  </g>
  <text class="muted rise a1" x="440" y="56" font-size="14" letter-spacing="2">CONTRIBUTIONS / MONTH</text>
  <text class="accent rise a1" x="1000" y="56" font-size="14" letter-spacing="0" text-anchor="end">1,390 total</text>
  <line class="draw a1" x1="440" y1="300" x2="1000" y2="300" stroke="#D0D7DE"/>
  <rect class="grow a1" x="448.9" y="300.0" width="28.9" height="0.0" fill="#93B4F5"/>
  <text class="muted" x="463.3" y="324" font-size="14" text-anchor="middle">12</text>
  <rect class="grow a1" x="495.5" y="296.9" width="28.9" height="3.1" fill="#93B4F5"/>
  <text class="muted" x="510.0" y="324" font-size="14" text-anchor="middle">1</text>
  <rect class="grow a1" x="542.2" y="296.9" width="28.9" height="3.1" fill="#93B4F5"/>
  <text class="muted" x="556.7" y="324" font-size="14" text-anchor="middle">2</text>
  <rect class="grow a2" x="588.9" y="298.1" width="28.9" height="1.9" fill="#93B4F5"/>
  <text class="muted" x="603.3" y="324" font-size="14" text-anchor="middle">3</text>
  <rect class="grow a2" x="635.5" y="300.0" width="28.9" height="0.0" fill="#93B4F5"/>
  <text class="muted" x="650.0" y="324" font-size="14" text-anchor="middle">4</text>
  <rect class="grow a2" x="682.2" y="300.0" width="28.9" height="0.0" fill="#93B4F5"/>
  <text class="muted" x="696.7" y="324" font-size="14" text-anchor="middle">5</text>
  <rect class="grow a3" x="728.9" y="296.6" width="28.9" height="3.4" fill="#93B4F5"/>
  <text class="muted" x="743.3" y="324" font-size="14" text-anchor="middle">6</text>
  <rect class="grow a3" x="775.5" y="213.6" width="28.9" height="86.4" fill="#93B4F5"/>
  <text class="muted" x="790.0" y="324" font-size="14" text-anchor="middle">7</text>
  <rect class="grow a3" x="822.2" y="290.3" width="28.9" height="9.7" fill="#93B4F5"/>
  <text class="muted" x="836.7" y="324" font-size="14" text-anchor="middle">8</text>
  <rect class="grow a4" x="868.9" y="260.4" width="28.9" height="39.6" fill="#93B4F5"/>
  <text class="muted" x="883.3" y="324" font-size="14" text-anchor="middle">9</text>
  <rect class="grow a4" x="915.5" y="213.6" width="28.9" height="86.4" fill="#93B4F5"/>
  <text class="muted" x="930.0" y="324" font-size="14" text-anchor="middle">10</text>
  <rect class="grow a4" x="962.2" y="100.0" width="28.9" height="200.0" fill="#1D4ED8"/>
  <text class="muted" x="976.7" y="324" font-size="14" text-anchor="middle">11</text>
  <text class="accent rise a5" x="976.7" y="90.0" font-size="14" text-anchor="middle">641</text>
</svg>
