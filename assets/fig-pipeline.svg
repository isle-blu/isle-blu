<svg viewBox="0 0 1000 350" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deployment pipeline: code, test, build, deploy, edge, watch across three projects">
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #1F2328; } .muted { fill: #59636E; } .accent { fill: #1D4ED8; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .grow { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleY(1); } }
    .a1 { animation-delay: .1s } .a2 { animation-delay: .35s } .a3 { animation-delay: .6s } .a4 { animation-delay: .85s } .a5 { animation-delay: 1.1s }
    @media (prefers-reduced-motion: reduce) { .draw, .rise, .grow { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; } }
  </style>

  <text class="muted rise a1" x="0" y="20" font-size="14" letter-spacing="3">FIG. 01</text>
  <text class="muted rise a1" x="1000" y="20" font-size="14" letter-spacing="3" text-anchor="end">FROM PULL REQUEST TO PRODUCTION</text>
  <g class="rise a1">
    <rect x="130" y="44" width="130" height="104" stroke="#D0D7DE"/>
    <text class="accent" x="142" y="70" font-size="14" letter-spacing="2.5">01 CODE</text>
    <text class="ink" x="142" y="102" font-size="15">PR · Review</text>
    <text class="muted" x="142" y="128" font-size="14">GitHub</text>
  </g>
  <path class="draw a3" d="M263 96 H271 M266 91 L271 96 L266 101" stroke="#59636E"/>
  <line class="draw a2" x1="195.0" y1="160" x2="195.0" y2="300" stroke="#D0D7DE" stroke-dasharray="2 5"/>
  <g class="rise a1">
    <rect x="274" y="44" width="130" height="104" stroke="#D0D7DE"/>
    <text class="accent" x="286" y="70" font-size="14" letter-spacing="2.5">02 TEST</text>
    <text class="ink" x="286" y="102" font-size="15">CI checks</text>
    <text class="muted" x="286" y="128" font-size="14">Actions</text>
  </g>
  <path class="draw a3" d="M407 96 H415 M410 91 L415 96 L410 101" stroke="#59636E"/>
  <line class="draw a2" x1="339.0" y1="160" x2="339.0" y2="300" stroke="#D0D7DE" stroke-dasharray="2 5"/>
  <g class="rise a2">
    <rect x="418" y="44" width="130" height="104" stroke="#D0D7DE"/>
    <text class="accent" x="430" y="70" font-size="14" letter-spacing="2.5">03 BUILD</text>
    <text class="ink" x="430" y="102" font-size="15">Image build</text>
    <text class="muted" x="430" y="128" font-size="14">GHCR / host</text>
  </g>
  <path class="draw a3" d="M551 96 H559 M554 91 L559 96 L554 101" stroke="#59636E"/>
  <line class="draw a2" x1="483.0" y1="160" x2="483.0" y2="300" stroke="#D0D7DE" stroke-dasharray="2 5"/>
  <g class="rise a2">
    <rect x="562" y="44" width="130" height="104" stroke="#D0D7DE"/>
    <text class="accent" x="574" y="70" font-size="14" letter-spacing="2.5">04 DEPLOY</text>
    <text class="ink" x="574" y="102" font-size="15">Compose</text>
    <text class="muted" x="574" y="128" font-size="14">auto rollback</text>
  </g>
  <path class="draw a3" d="M695 96 H703 M698 91 L703 96 L698 101" stroke="#59636E"/>
  <line class="draw a2" x1="627.0" y1="160" x2="627.0" y2="300" stroke="#D0D7DE" stroke-dasharray="2 5"/>
  <g class="rise a3">
    <rect x="706" y="44" width="130" height="104" stroke="#D0D7DE"/>
    <text class="accent" x="718" y="70" font-size="14" letter-spacing="2.5">05 EDGE</text>
    <text class="ink" x="718" y="102" font-size="15">HTTPS proxy</text>
    <text class="muted" x="718" y="128" font-size="14">Caddy / nginx</text>
  </g>
  <path class="draw a3" d="M839 96 H847 M842 91 L847 96 L842 101" stroke="#59636E"/>
  <line class="draw a2" x1="771.0" y1="160" x2="771.0" y2="300" stroke="#D0D7DE" stroke-dasharray="2 5"/>
  <g class="rise a3">
    <rect x="850" y="44" width="130" height="104" stroke="#D0D7DE"/>
    <text class="accent" x="862" y="70" font-size="14" letter-spacing="2.5">06 WATCH</text>
    <text class="ink" x="862" y="102" font-size="15">Alert · k6</text>
    <text class="muted" x="862" y="128" font-size="14">dashboard</text>
  </g>
  <line class="draw a2" x1="915.0" y1="160" x2="915.0" y2="300" stroke="#D0D7DE" stroke-dasharray="2 5"/>
  <g class="rise a3">
    <text class="ink" x="0" y="201" font-size="15" letter-spacing="2">SHOWMOA</text>
    <circle cx="195.0" cy="196" r="8" fill="#1D4ED8"/>
    <circle cx="339.0" cy="196" r="7" stroke="#D0D7DE" stroke-width="1.5"/>
    <circle cx="483.0" cy="196" r="8" fill="#1D4ED8"/>
    <circle cx="627.0" cy="196" r="8" fill="#1D4ED8"/>
    <circle cx="771.0" cy="196" r="8" fill="#1D4ED8"/>
    <circle cx="915.0" cy="196" r="8" fill="#1D4ED8"/>
  </g>
  <g class="rise a4">
    <text class="ink" x="0" y="245" font-size="15" letter-spacing="2">TEST MOA</text>
    <circle cx="195.0" cy="240" r="8" fill="#1D4ED8"/>
    <circle cx="339.0" cy="240" r="8" fill="#1D4ED8"/>
    <circle cx="483.0" cy="240" r="8" fill="#1D4ED8"/>
    <circle cx="627.0" cy="240" r="8" fill="#1D4ED8"/>
    <circle cx="771.0" cy="240" r="8" fill="#1D4ED8"/>
    <circle cx="915.0" cy="240" r="7" stroke="#D0D7DE" stroke-width="1.5"/>
  </g>
  <g class="rise a5">
    <text class="ink" x="0" y="289" font-size="15" letter-spacing="2">PAWMENTO</text>
    <circle cx="195.0" cy="284" r="8" fill="#1D4ED8"/>
    <circle cx="339.0" cy="284" r="8" fill="#1D4ED8"/>
    <circle cx="483.0" cy="284" r="8" fill="#1D4ED8"/>
    <circle cx="627.0" cy="284" r="8" fill="#1D4ED8"/>
    <circle cx="771.0" cy="284" r="8" fill="#1D4ED8"/>
    <circle cx="915.0" cy="284" r="7" stroke="#D0D7DE" stroke-width="1.5"/>
  </g>
  <g class="rise a5">
    <circle cx="136" cy="333" r="7" fill="#1D4ED8"/>
    <text class="muted" x="152" y="338" font-size="14">handled myself</text>
    <circle cx="316" cy="333" r="6" stroke="#D0D7DE" stroke-width="1.5"/>
    <text class="muted" x="332" y="338" font-size="14">not in this project</text>
  </g>
</svg>
